# Desarrollo: docker compose -f deploy/docker-compose.yml up --build
# docker compose -f deploy/docker-compose.yml --profile web up --build
# LangGraph Studio: docker compose -f deploy/docker-compose.yml --profile studio up --build studio
#   -> https://smith.langchain.com/studio/?baseUrl=http://127.0.0.1:2024

# Producción: --profile web, imágenes ECR inyectadas por deploy-ec2.yml.
services:
  api:
    image: ${APEIRON_API_IMAGE:-apeiron-api:local}
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
      args:
        PYTHON_VERSION: "3.14"
    env_file: ../.env
    environment:
      APEIRON_CHROMA_HOST: chroma
      APEIRON_CHROMA_PORT: "8000"
      APEIRON_SCHOLAR_MCP_URL: http://mcp-scholar:8080/mcp
    volumes:
      - api-data:/app/data          # usuarios SQLite (APEIRON_USERS_DB_PATH=data/users.db)
    depends_on:
      - chroma
      - mcp-scholar                 # opcional: si no responde, scholarly_search degrada (breaker)
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Servidor MCP interno de literatura académica (OpenAlex). Misma imagen que la API, otro proceso;
  # sin puerto publicado: solo lo alcanza la red de Compose (ADR-011).
  mcp-scholar:
    image: ${APEIRON_API_IMAGE:-apeiron-api:local}
    command: ["python", "-m", "apeiron_mcp_scholar"]
    environment:
      APEIRON_OPENALEX_MAILTO: ${APEIRON_OPENALEX_MAILTO:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

  chroma:
    image: ${APEIRON_CHROMA_IMAGE:-chromadb/chroma:1.5.9}
    environment:
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma-data:/data           # verifica la ruta de persistencia según la versión de la imagen
    restart: unless-stopped

  web:
    profiles: ["web"]
    image: ${APEIRON_WEB_IMAGE:-apeiron-web:local}
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy   # la SPA lee /v1/auth/config al cargar: la API debe estar lista
    ports:
      - "80:80"
    restart: unless-stopped

  studio:
    profiles: ["studio"]            # solo desarrollo: servidor `langgraph dev` para Studio
    image: apeiron-studio:local
    build:
      context: ..
      dockerfile: deploy/docker/studio.Dockerfile
    env_file: ../.env
    environment:
      APEIRON_CHROMA_HOST: chroma
      APEIRON_CHROMA_PORT: "8000"
      APEIRON_SCHOLAR_MCP_URL: http://mcp-scholar:8080/mcp
    depends_on:
      - chroma
      - mcp-scholar
    ports:
      - "127.0.0.1:2024:2024"

volumes:
  api-data:
  chroma-data:
