server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }

  # Proxy al API; sin buffering para que el SSE llegue token a token.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  # A2A (ADR-011): la Agent Card vive en la raíz del origen; el endpoint JSON-RPC hace streaming.
  # En producción fija APEIRON_A2A_PUBLIC_URL=https://<dominio> para que la card anuncie https.
  location = /.well-known/agent-card.json {
    proxy_pass http://api:8000/.well-known/agent-card.json;
    proxy_set_header Host $host;
  }

  location = /a2a {
    proxy_pass http://api:8000/a2a;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
}
