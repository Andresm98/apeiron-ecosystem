[project]
name = "apeiron-core"
version = "0.2.0"
description = "Dominio + orquestación (sin web, sin proveedores). Solo depende de LangGraph."
requires-python = ">=3.12"
dependencies = ["langgraph>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
