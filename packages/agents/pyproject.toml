[project]
name = "apeiron-agents"
version = "0.1.0"
description = "Catálogo de agentes: una carpeta por agente con manifiesto, persona, acceso y tarjeta A2A (ADR-013, catálogo de agentes)."
requires-python = ">=3.12"
dependencies = ["apeiron-core"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Las carpetas de agentes no son paquetes Python: son datos que viajan con el paquete.
[tool.setuptools.package-data]
apeiron_agents = ["*/agent.toml", "*/persona.md"]
