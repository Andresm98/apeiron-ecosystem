name: CI - Apeiron Ecosystem

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/core/pyproject.toml
            packages/infra/pyproject.toml
            services/api/pyproject.toml

      - name: Install packages and validation tools
        run: >-
          python -m pip install
          -e packages/core
          -e "packages/infra[llm,chroma,mcp]"
          -e services/api
          -e services/mcp-scholar
          pytest pytest-asyncio ruff mypy import-linter

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy packages/core/src packages/infra/src services/api/src services/mcp-scholar/src

      - name: Architecture contracts
        run: lint-imports

      - name: Tests
        run: pytest -q

  frontend-check:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production frontend
        working-directory: apps/web
        run: npm run build -- --configuration production

  build-and-push:
    name: Build and publish immutable GHCR images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-prefix: ${{ steps.image.outputs.prefix }}
      image-tag: ${{ steps.tag.outputs.image-tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve GHCR image prefix
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Create unique release tag
        id: tag
        shell: bash
        run: echo "image-tag=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          build-args: |
            PYTHON_VERSION=3.14
          tags: ${{ steps.image.outputs.prefix }}/apeiron-api:${{ steps.tag.outputs.image-tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/apeiron-web:${{ steps.tag.outputs.image-tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max