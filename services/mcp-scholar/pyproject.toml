[project]
name = "apeiron-mcp-scholar"
version = "0.1.0"
description = "Servidor MCP (streamable HTTP) de literatura académica con DOI vía OpenAlex. Independiente del resto del monorepo."
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
