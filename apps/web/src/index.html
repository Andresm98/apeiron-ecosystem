<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ápeiron | Consola</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2319362a%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23eef1eb%27%3E%CE%91%3C/text%3E%3C/svg%3E" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1713" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <script>
      // Aplica el tema guardado antes del primer pintado (evita el destello claro/oscuro).
      try {
        const theme = localStorage.getItem('apeiron-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset['theme'] = theme;
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
