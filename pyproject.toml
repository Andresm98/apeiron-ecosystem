# Config de herramientas del monorepo (no es un paquete).
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "packages/infra/tests", "services/api/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/core/src", "packages/infra/src", "services/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["UP046", "UP047"]  # TypeVar clásico: compatible con el piso 3.12

[tool.ruff.lint.per-file-ignores]
"packages/infra/src/apeiron_infra/memory/vector.py" = ["E501"]  # corpus semilla en prosa

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["packages/core/src", "packages/infra/src", "services/api/src"]
