[project]
name = "apeiron-api"
version = "0.2.0"
description = "Capa de presentación (FastAPI) y composition root. Único servicio desplegable del backend."
requires-python = ">=3.12"
dependencies = ["apeiron-core", "apeiron-infra", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.4", "python-multipart>=0.0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
