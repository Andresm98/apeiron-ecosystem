[project]
name = "apeiron-infra"
version = "0.2.0"
description = "Adaptadores: LLM, resiliencia, observabilidad, seguridad, tools, memoria vectorial."
requires-python = ">=3.12"
dependencies = ["apeiron-core", "tenacity>=8.2", "httpx>=0.27", "pyjwt>=2.8", "bcrypt>=4.1"]

[project.optional-dependencies]
llm = ["langchain>=0.3", "langchain-anthropic>=0.3", "langchain-openai>=0.3"]
chroma = [
    "chromadb-client>=0.5",
    "onnxruntime",
    "tokenizers"
]
mcp = ["mcp>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
